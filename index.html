<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GH Uploader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f6f8fa" id="theme-meta">
    <style>
        /* --- Theme Variables --- */
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --primary: #2ea44f;
            --text: #24292f;
            --border: #d0d7de;
        }
        [data-theme="dark"] {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text: #e6edf3;
            --border: #30363d;
        }
        [data-theme="black"] {
            --bg-color: #000000;
            --card-bg: #000000;
            --text: #e6edf3;
            --border: #333333;
        }

        /* --- Global Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        
        .header-actions {
            display: flex; justify-content: center; gap: 10px; margin-top: 15px; align-items: center;
        }
        .header-btn {
            padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 14px;
        }

        /* --- Inputs and Selectors --- */
        input[type="text"], input[type="password"], input[type="file"], select, textarea {
            width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border);
            border-radius: 6px; box-sizing: border-box; background-color: var(--card-bg); color: var(--text);
        }
        #theme-selector { width: auto; display: inline-block; padding: 8px; cursor: pointer; margin-bottom: 0; }
        textarea { resize: vertical; font-family: monospace; font-size: 12px; }

        /* --- Tab Navigation --- */
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-nav button {
            border-radius: 6px; padding: 10px; font-size: 16px; border: 2px solid var(--border);
            color: var(--text); background-color: transparent; width: 100%; cursor: pointer;
        }
        .tab-nav button.active-tab {
            border-color: var(--primary); color: var(--primary); background-color: rgba(46, 164, 79, 0.1);
        }

        /* --- Buttons --- */
        button.primary-btn {
            background-color: transparent; color: var(--primary); border: 2px solid var(--primary);
            border-radius: 12px; padding: 16px 32px; font-size: 20px; cursor: pointer;
            font-weight: 600; width: 100%; transition: 0.3s;
        }
        button.primary-btn:hover { background-color: var(--primary); color: #ffffff; }
        button.primary-btn:disabled { border-color: #94d3a2; color: #94d3a2; cursor: not-allowed; }
        
        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .action-buttons button { flex: 1; padding: 12px 16px; border-radius: 6px; cursor: pointer; }
        .action-buttons input { margin-bottom: 0; }
        .action-buttons select { margin-bottom: 0; padding: 12px 10px; width: auto; cursor: pointer; }

        .delete-btn { border: 2px solid #cf222e; color: #cf222e; padding: 8px 10px; font-size: 14px; margin-top: 5px; background: transparent; cursor: pointer; border-radius: 6px;}
        .delete-btn:hover { background-color: #cf222e; color: #ffffff; }

        /* --- History Section --- */
        .history-section { margin-top: 30px; }
        .history-item {
            display: flex; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 15px; margin-bottom: 15px; gap: 15px; align-items: center;
        }
        
        .history-left-col {
            display: flex; flex-direction: column; width: 100px; min-width: 100px; gap: 5px; align-items: center;
        }
        .history-thumb {
            width: 100px; height: 100px; object-fit: cover; border-radius: 4px;
            cursor: pointer; border: 1px solid var(--border); display: flex; align-items: center;
            justify-content: center; background-color: var(--bg-color); font-weight: bold; overflow: hidden;
        }
        .history-filename {
            font-size: 11px; width: 100%; text-align: center; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; text-transform: lowercase; font-weight: 600;
        }
        .history-filesize {
            font-size: 10px; color: #888; text-align: center;
        }

        .history-details { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .history-details label { font-size: 12px; margin-bottom: 3px; font-weight: 600; }
        .history-details input { font-family: monospace; font-size: 12px; margin-bottom: 8px; cursor: pointer; }

        /* --- Manager Section Styles --- */
        .repo-item {
            display: flex; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 12px; margin-bottom: 10px; align-items: center; justify-content: space-between; gap: 10px;
        }
        .repo-item-info { flex-grow: 1; overflow: hidden; cursor: pointer; }
        .repo-item-name { font-weight: bold; font-size: 14px; word-break: break-all; }
        .repo-item-type { font-size: 11px; color: #888; text-transform: uppercase; }
        
        .manager-thumb {
            width: 40px; height: 40px; min-width: 40px; object-fit: cover; border-radius: 4px;
            cursor: pointer; border: 1px solid var(--border); display: flex; align-items: center;
            justify-content: center; background-color: var(--bg-color); font-weight: bold; font-size: 10px; overflow: hidden;
        }
        .repo-actions button { padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; background: transparent;}
        .btn-move { border: 1px solid #0969da; color: #0969da; }
        .btn-move:hover { background-color: #0969da; color: #ffffff; }

        /* --- 3-Dot Menu Styles --- */
        .menu-container { position: relative; display: inline-block; }
        .kebab-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 10px; color: var(--text); font-weight: bold; }
        .kebab-btn:hover { color: var(--primary); }
        .dropdown-menu {
            display: none; position: absolute; right: 0; top: 35px; background-color: var(--card-bg);
            min-width: 130px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 10;
            border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
        }
        .dropdown-menu button {
            width: 100%; text-align: left; border: none; padding: 12px 15px; border-radius: 0;
            font-size: 14px; background: transparent; color: var(--text); cursor: pointer;
        }
        .dropdown-menu button:hover { background-color: var(--bg-color); color: var(--primary); }
        .dropdown-menu .delete-action { color: #cf222e; }
        .dropdown-menu .delete-action:hover { background-color: #ffebe9; color: #cf222e; }
        .show { display: block; }

        /* --- Modal Styles --- */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content {
            background-color: var(--card-bg); margin: 10% auto; padding: 25px;
            border: 1px solid var(--border); width: 90%; max-width: 500px; border-radius: 12px;
        }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 20px;}
        .close-btn:hover { color: var(--text); }
        #share-preview { margin-bottom: 20px; text-align: center; }
        #share-preview img { max-width: 100%; border-radius: 6px; max-height: 250px; object-fit: contain; }
        
        #status-message, #manager-status { text-align: center; margin-top: 10px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GH Uploader</h1>
            <div class="header-actions">
                <select id="theme-selector">
                    <option value="light">Light Mode</option>
                    <option value="dark">Dark Mode</option>
                    <option value="black">Amoled Black</option>
                </select>
                <button id="import-export-btn" class="header-btn">Data ⚙️</button>
            </div>
        </header>

        <section class="config-section">
            <input type="password" id="gh-token" placeholder="GitHub Personal Access Token" />
            <input type="text" id="gh-repo" placeholder="Owner/Repo (e.g., yourname/gh-uploader)" />
        </section>

        <div class="tab-nav">
            <button id="tab-upload-btn" class="active-tab">Upload</button>
            <button id="tab-manage-btn">Manage Repo</button>
        </div>

        <!-- UPLOAD VIEW -->
        <div id="upload-view">
            <section class="config-section">
                <input type="text" id="gh-folder" placeholder="Upload Folder (leave blank for root)" />
            </section>
            <section class="upload-section">
                <input type="file" id="file-input" accept="image/*, .pdf, .txt, .zip, video/*, audio/*" multiple />
                <div class="action-buttons">
                    <button id="paste-btn" class="primary-btn" style="padding: 12px; font-size: 16px;">Paste Image</button>
                    <button id="upload-btn" class="primary-btn" style="padding: 12px; font-size: 16px;">Upload File(s)</button>
                </div>
                <div id="status-message"></div>
            </section>
            <section class="history-section">
                <h2>Upload History</h2>
                <div id="history-list"></div>
            </section>
        </div>

        <!-- MANAGE VIEW -->
        <div id="manage-view" style="display: none;">
            <div class="action-buttons">
                <input type="text" id="manager-path" placeholder="Path (e.g., folder/subfolder)" style="flex: 2;" />
                <select id="sort-files" style="flex: 1;">
                    <option value="name-asc">A - Z</option>
                    <option value="name-desc">Z - A</option>
                    <option value="size-desc">Largest First</option>
                    <option value="size-asc">Smallest First</option>
                </select>
                <button id="refresh-dir-btn" class="primary-btn" style="padding: 12px; font-size: 16px; width: auto;">Load</button>
            </div>
            <div id="manager-status"></div>
            <div id="repo-file-list"></div>
        </div>
    </div>

    <!-- SHARE MODAL -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeShareModal()">&times;</span>
            <h2 style="margin-top: 0;">Share File</h2>
            <div id="share-preview"></div>
            <label style="font-size: 12px; font-weight: bold;">Direct Link: (Tap to copy)</label>
            <input type="text" id="share-link" readonly onclick="copyToClipboard(this)">
            <label style="font-size: 12px; font-weight: bold;">Markdown: (Tap to copy)</label>
            <input type="text" id="share-markdown" readonly onclick="copyToClipboard(this)">
        </div>
    </div>

    <!-- IMPORT/EXPORT MODAL -->
    <div id="data-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDataModal()">&times;</span>
            <h2 style="margin-top: 0;">Import / Export Data</h2>
            <p style="font-size: 12px; color: #888;">Copy this JSON to backup your config and history, or paste valid JSON here and tap Import to restore your setup.</p>
            <textarea id="data-textarea" rows="10"></textarea>
            <div class="action-buttons">
                <button class="primary-btn" onclick="importData()" style="padding: 10px; font-size: 14px;">Import & Save</button>
                <button class="primary-btn" onclick="copyDataText()" style="padding: 10px; font-size: 14px; border-color: #0969da; color: #0969da;">Copy JSON</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Service Worker ---
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

            // --- DOM Elements ---
            const tokenInput = document.getElementById('gh-token');
            const repoInput = document.getElementById('gh-repo');
            const folderInput = document.getElementById('gh-folder');
            const fileInput = document.getElementById('file-input');
            const uploadBtn = document.getElementById('upload-btn');
            const pasteBtn = document.getElementById('paste-btn');
            const statusMsg = document.getElementById('status-message');
            const historyList = document.getElementById('history-list');
            const themeSelector = document.getElementById('theme-selector');
            const themeMeta = document.getElementById('theme-meta');

            const tabUploadBtn = document.getElementById('tab-upload-btn');
            const tabManageBtn = document.getElementById('tab-manage-btn');
            const uploadView = document.getElementById('upload-view');
            const manageView = document.getElementById('manage-view');

            const managerPath = document.getElementById('manager-path');
            const sortFilesDropdown = document.getElementById('sort-files');
            const refreshDirBtn = document.getElementById('refresh-dir-btn');
            const managerStatus = document.getElementById('manager-status');
            const repoFileList = document.getElementById('repo-file-list');
            const importExportBtn = document.getElementById('import-export-btn');

            let currentRepoFiles = [];

            // --- Tabs ---
            tabUploadBtn.addEventListener('click', () => {
                uploadView.style.display = 'block'; manageView.style.display = 'none';
                tabUploadBtn.classList.add('active-tab'); tabManageBtn.classList.remove('active-tab');
            });

            tabManageBtn.addEventListener('click', () => {
                uploadView.style.display = 'none'; manageView.style.display = 'block';
                tabManageBtn.classList.add('active-tab'); tabUploadBtn.classList.remove('active-tab');
                if (repoFileList.innerHTML === '') loadRepoFiles(); 
            });

            // --- Theme ---
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                if (themeMeta) {
                    if (theme === 'dark') themeMeta.content = '#0d1117';
                    else if (theme === 'black') themeMeta.content = '#000000';
                    else themeMeta.content = '#f6f8fa'; 
                }
            }
            const savedTheme = localStorage.getItem('ghTheme') || 'light';
            applyTheme(savedTheme);
            if(themeSelector) {
                themeSelector.value = savedTheme;
                themeSelector.addEventListener('change', (e) => {
                    applyTheme(e.target.value);
                    localStorage.setItem('ghTheme', e.target.value);
                });
            }

            // --- Credentials ---
            tokenInput.value = localStorage.getItem('ghToken') || '';
            repoInput.value = localStorage.getItem('ghRepo') || '';
            if(folderInput) folderInput.value = localStorage.getItem('ghFolder') || '';

            checkSharedFiles();

            // --- Helpers ---
            function formatBytes(bytes, decimals = 2) {
                if (!+bytes) return '0 Bytes';
                const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
            }

            function getExtensionFromMime(mimeType, filename = '') {
                if (filename.includes('.')) return filename.split('.').pop();
                const mimeMap = {
                    'application/pdf': 'pdf', 'text/plain': 'txt', 'image/jpeg': 'jpg', 'image/png': 'png',
                    'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'application/zip': 'zip',
                    'audio/mpeg': 'mp3', 'video/mp4': 'mp4'
                };
                let ext = mimeMap[mimeType];
                if (!ext && mimeType) ext = mimeType.split('/')[1]?.split(';')[0]; 
                return ext || 'bin';
            }

            function getCdnUrl(rawUrl) {
                if (!rawUrl) return '';
                return rawUrl.replace(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\//, 'cdn.jsdelivr.net/gh/$1/$2@$3/');
            }

            // --- Upload & Paste Logic ---
            if(pasteBtn) {
                pasteBtn.addEventListener('click', async () => {
                    try {
                        const clipboardItems = await navigator.clipboard.read();
                        const dataTransfer = new DataTransfer();
                        for (const item of clipboardItems) {
                            const imageTypes = item.types.filter(type => type.startsWith('image/'));
                            for (const type of imageTypes) {
                                const blob = await item.getType(type);
                                const ext = getExtensionFromMime(type);
                                const file = new File([blob], `pasted_${Date.now()}.${ext}`, { type });
                                dataTransfer.items.add(file);
                            }
                        }
                        if (dataTransfer.files.length > 0) {
                            fileInput.files = dataTransfer.files;
                            statusMsg.innerText = `${dataTransfer.files.length} image(s) pasted!`;
                        } else alert('No image found in clipboard.');
                    } catch (err) { alert('Clipboard access denied or empty.'); }
                });
            }

            uploadBtn.addEventListener('click', async () => {
                const files = Array.from(fileInput.files);
                if (files.length === 0) return alert('Please select a file.');

                const token = tokenInput.value.trim();
                const repo = repoInput.value.trim();
                const folder = folderInput ? folderInput.value.trim() : '';
                
                if (!token || !repo) return alert('Token and Repo are required.');
                localStorage.setItem('ghToken', token); localStorage.setItem('ghRepo', repo);
                if(folderInput) localStorage.setItem('ghFolder', folder);

                uploadBtn.disabled = true; let successCount = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusMsg.innerText = `Uploading ${i + 1} of ${files.length}...`;
                    try {
                        const base64Data = await new Promise((res, rej) => {
                            const reader = new FileReader();
                            reader.onload = () => res(reader.result.split(',')[1]);
                            reader.onerror = error => rej(error);
                            reader.readAsDataURL(file);
                        });
                        
                        let originalName = file.name;
                        const ext = getExtensionFromMime(file.type, originalName);
                        if (!originalName.includes('.')) originalName = `${originalName}.${ext}`;
                        const fileName = originalName.replace(/\s+/g, '_');
                        const path = folder ? `${folder}/${fileName}` : fileName;

                        let existingSha = undefined;
                        try {
                            const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { headers: { 'Authorization': `Bearer ${token}` } });
                            if (checkRes.ok) existingSha = (await checkRes.json()).sha;
                        } catch(e) {}

                        const payload = { message: `Upload ${fileName}`, content: base64Data };
                        if (existingSha) payload.sha = existingSha; 

                        const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                            method: 'PUT',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        if (response.ok) {
                            successCount++;
                            saveToHistory(getCdnUrl(data.content.download_url), file.type, fileName, file.size);
                        } else console.error(`Error uploading ${file.name}:`, data.message);
                    } catch (error) { console.error(`Catch error on ${file.name}:`, error); }
                }

                statusMsg.innerText = `Successfully uploaded ${successCount} out of ${files.length} files.`;
                uploadBtn.disabled = false; fileInput.value = ''; renderHistory();
            });

            function saveToHistory(url, type, filename = '', size = 0) {
                let history = JSON.parse(localStorage.getItem('ghHistory')) || [];
                history.unshift({ url, type, filename, size, date: new Date().toLocaleString() });
                localStorage.setItem('ghHistory', JSON.stringify(history));
            }

            function renderHistory() {
                historyList.innerHTML = '';
                let history = JSON.parse(localStorage.getItem('ghHistory')) || [];
                history.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    
                    const isImage = item.type.startsWith('image/');
                    let extLabel = item.url.split('.').pop().toUpperCase();
                    if(extLabel.length > 4 || extLabel.includes('/')) extLabel = 'FILE';

                    const thumb = isImage 
                        ? `<img src="${item.url}" class="history-thumb" onclick="window.open('${item.url}', '_blank')" alt="thumbnail">` 
                        : `<div class="history-thumb" onclick="window.open('${item.url}', '_blank')">${extLabel}</div>`;
                    
                    const markdownCode = isImage ? `![Image](${item.url})` : `[File](${item.url})`;
                    
                    // Format display name and size for the new layout
                    const displayName = (item.filename || item.url.split('/').pop()).toLowerCase();
                    const displaySize = item.size ? formatBytes(item.size) : 'N/A';

                    div.innerHTML = `
                        <div class="history-left-col">
                            ${thumb}
                            <div class="history-filename" title="${displayName}">${displayName}</div>
                            <div class="history-filesize">${displaySize}</div>
                        </div>
                        <div class="history-details">
                            <label>Direct Link: (Tap to copy)</label>
                            <input type="text" value="${item.url}" readonly onclick="copyToClipboard(this)">
                            <label>Markdown: (Tap to copy)</label>
                            <input type="text" value="${markdownCode}" readonly onclick="copyToClipboard(this)">
                            <button class="delete-btn" onclick="deleteHistoryItem(${index})">Delete from History</button>
                        </div>
                    `;
                    historyList.appendChild(div);
                });
            }

            // --- Import/Export Logic ---
            importExportBtn.addEventListener('click', () => {
                const appData = {
                    ghToken: localStorage.getItem('ghToken') || '',
                    ghRepo: localStorage.getItem('ghRepo') || '',
                    ghFolder: localStorage.getItem('ghFolder') || '',
                    ghTheme: localStorage.getItem('ghTheme') || 'light',
                    ghHistory: JSON.parse(localStorage.getItem('ghHistory')) || []
                };
                document.getElementById('data-textarea').value = JSON.stringify(appData, null, 2);
                document.getElementById('data-modal').style.display = 'block';
            });

            window.closeDataModal = function() {
                document.getElementById('data-modal').style.display = 'none';
            }

            window.copyDataText = function() {
                const textarea = document.getElementById('data-textarea');
                textarea.select();
                navigator.clipboard.writeText(textarea.value);
                alert('JSON Data copied to clipboard!');
            }

            window.importData = function() {
                try {
                    const textarea = document.getElementById('data-textarea');
                    const appData = JSON.parse(textarea.value);
                    
                    if(appData.ghToken !== undefined) localStorage.setItem('ghToken', appData.ghToken);
                    if(appData.ghRepo !== undefined) localStorage.setItem('ghRepo', appData.ghRepo);
                    if(appData.ghFolder !== undefined) localStorage.setItem('ghFolder', appData.ghFolder);
                    if(appData.ghTheme !== undefined) localStorage.setItem('ghTheme', appData.ghTheme);
                    if(appData.ghHistory !== undefined) localStorage.setItem('ghHistory', JSON.stringify(appData.ghHistory));
                    
                    alert('Data imported successfully! The app will now reload.');
                    location.reload();
                } catch(e) {
                    alert('Invalid JSON format. Please check the pasted text and try again.');
                }
            }


            // --- File Manager UI Logic ---
            refreshDirBtn.addEventListener('click', loadRepoFiles);
            sortFilesDropdown.addEventListener('change', renderRepoList);

            async function loadRepoFiles() {
                const token = tokenInput.value.trim();
                const repo = repoInput.value.trim();
                let path = managerPath.value.trim();

                if (!token || !repo) return alert('Token and Repo are required.');
                managerStatus.innerText = 'Loading files...';
                repoFileList.innerHTML = '';

                try {
                    const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!response.ok) throw new Error('Failed to load directory. Ensure path is correct.');
                    const files = await response.json();
                    managerStatus.innerText = '';
                    
                    currentRepoFiles = Array.isArray(files) ? files : [files];
                    renderRepoList(); 
                } catch (error) { managerStatus.innerText = error.message; }
            }

            function renderRepoList() {
                repoFileList.innerHTML = '';
                const sortType = sortFilesDropdown.value;

                let folders = currentRepoFiles.filter(f => f.type === 'dir');
                let files = currentRepoFiles.filter(f => f.type === 'file');

                folders.sort((a, b) => a.name.localeCompare(b.name));

                if (sortType === 'name-asc') files.sort((a, b) => a.name.localeCompare(b.name));
                else if (sortType === 'name-desc') files.sort((a, b) => b.name.localeCompare(a.name));
                else if (sortType === 'size-asc') files.sort((a, b) => a.size - b.size);
                else if (sortType === 'size-desc') files.sort((a, b) => b.size - a.size);

                const sortedArray = [...folders, ...files];

                sortedArray.forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'repo-item';
                    
                    const isImage = file.name.match(/\.(jpeg|jpg|gif|png|webp|svg)$/i);
                    const cdnUrl = file.download_url ? getCdnUrl(file.download_url) : '';
                    
                    const isFile = file.type === 'file';
                    const fileClickHandler = isFile ? `window.open('${cdnUrl}', '_blank')` : `document.getElementById('manager-path').value = '${file.path}'; document.getElementById('refresh-dir-btn').click();`;

                    let extLabel = file.name.split('.').pop().toUpperCase();
                    if(extLabel.length > 4) extLabel = extLabel.substring(0, 4);

                    const thumbHtml = isFile
                        ? (isImage 
                            ? `<img src="${cdnUrl}" class="manager-thumb" onclick="${fileClickHandler}" alt="preview">` 
                            : `<div class="manager-thumb" onclick="${fileClickHandler}">${extLabel}</div>`)
                        : `<div class="manager-thumb" onclick="${fileClickHandler}">DIR</div>`;

                    let actionHtml = '';
                    if (isFile) {
                        actionHtml = `
                        <div class="menu-container">
                            <button class="kebab-btn" onclick="toggleMenu('${file.sha}', event)">&#8942;</button>
                            <div id="menu-${file.sha}" class="dropdown-menu">
                                <button onclick="openShareModal('${cdnUrl}', ${isImage ? 'true' : 'false'})">Share</button>
                                <button onclick="renameFile('${file.path}', '${file.sha}')">Move / Rename</button>
                                <button class="delete-action" onclick="deleteRemoteFile('${file.path}', '${file.sha}')">Delete</button>
                            </div>
                        </div>
                        `;
                    } else {
                        actionHtml = `<div class="repo-actions"><button class="btn-move" onclick="${fileClickHandler}">Open Dir</button></div>`;
                    }

                    div.innerHTML = `
                        ${thumbHtml}
                        <div class="repo-item-info" onclick="${fileClickHandler}">
                            <div class="repo-item-name">${file.name}</div>
                            <div class="repo-item-type">${file.type} ${isFile ? `(${formatBytes(file.size)})` : ''}</div>
                        </div>
                        ${actionHtml}
                    `;
                    repoFileList.appendChild(div);
                });
            }

            // --- Global Functions (Clipboard, Menus, Modals) ---
            window.copyToClipboard = function(element) {
                element.select(); navigator.clipboard.writeText(element.value);
                const originalBg = element.style.backgroundColor;
                const originalColor = element.style.color;
                element.style.backgroundColor = '#2ea44f'; element.style.color = '#fff';
                setTimeout(() => { element.style.backgroundColor = originalBg; element.style.color = originalColor; }, 300);
            }

            window.deleteHistoryItem = function(index) {
                let history = JSON.parse(localStorage.getItem('ghHistory')) || [];
                history.splice(index, 1);
                localStorage.setItem('ghHistory', JSON.stringify(history));
                renderHistory();
            }

            // Manage Dropdown Menu
            window.toggleMenu = function(sha, event) {
                event.stopPropagation();
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    if (m.id !== `menu-${sha}`) m.classList.remove('show');
                });
                document.getElementById(`menu-${sha}`).classList.toggle('show');
            }

            document.addEventListener('click', () => {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            });

            // Share Modal Functions
            window.openShareModal = function(url, isImage) {
                document.getElementById('share-modal').style.display = 'block';
                document.getElementById('share-link').value = url;
                document.getElementById('share-markdown').value = isImage ? `![Image](${url})` : `[File](${url})`;

                const preview = document.getElementById('share-preview');
                if (isImage) {
                    preview.innerHTML = `<img src="${url}">`;
                } else {
                    const ext = url.split('.').pop().toUpperCase();
                    preview.innerHTML = `<div style="padding: 40px; font-weight: bold; font-size: 24px; background: var(--bg-color); border: 2px dashed var(--border); border-radius: 6px; color: var(--text);">${ext} FILE</div>`;
                }
            }

            window.closeShareModal = function() {
                document.getElementById('share-modal').style.display = 'none';
            }

            window.deleteRemoteFile = async function(path, sha) {
                if (!confirm(`Are you sure you want to delete ${path}?`)) return;
                const token = tokenInput.value.trim(); const repo = repoInput.value.trim();
                managerStatus.innerText = `Deleting ${path}...`;
                try {
                    const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Delete ${path} via Manager`, sha: sha })
                    });
                    if (response.ok) { alert('File deleted successfully.'); loadRepoFiles(); }
                    else throw new Error((await response.json()).message);
                } catch (error) { alert(`Delete failed: ${error.message}`); managerStatus.innerText = ''; }
            }

            window.renameFile = async function(oldPath, sha) {
                const newPath = prompt(`Enter new path/name for this file:`, oldPath);
                if (!newPath || newPath === oldPath) return;
                const token = tokenInput.value.trim(); const repo = repoInput.value.trim();
                managerStatus.innerText = `Moving ${oldPath} to ${newPath}...`;
                try {
                    const getRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${sha}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!getRes.ok) throw new Error("Failed to fetch source file data.");
                    const blobData = await getRes.json();
                    
                    const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${newPath}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Move ${oldPath} to ${newPath}`, content: blobData.content.replace(/\n/g, '') })
                    });
                    if (!putRes.ok) throw new Error("Failed to create the new file.");

                    const delRes = await fetch(`https://api.github.com/repos/${repo}/contents/${oldPath}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Cleanup old file`, sha: sha })
                    });
                    if (delRes.ok) { alert('Moved successfully!'); loadRepoFiles(); }
                } catch (error) { alert(`Operation failed: ${error.message}`); managerStatus.innerText = ''; }
            }

            // --- PWA Shared Files ---
            async function checkSharedFiles() {
                if ('caches' in window) {
                    const cache = await caches.open('shared-files');
                    const countRes = await cache.match('/shared-file-count');
                    const namesRes = await cache.match('/shared-file-names'); 
                    
                    if (countRes) {
                        const count = parseInt(await countRes.text());
                        const names = namesRes ? await namesRes.json() : [];
                        const dataTransfer = new DataTransfer();
                        
                        for (let i = 0; i < count; i++) {
                            const res = await cache.match(`/shared-file-${i}`);
                            if (res) {
                                const blob = await res.blob();
                                let originalName = names[i];
                                const ext = getExtensionFromMime(blob.type, originalName);
                                
                                if (!originalName || originalName === 'blob' || originalName === 'image.jpg' || originalName === 'file') {
                                    originalName = `shared_file_${Date.now()}.${ext}`;
                                } else if (!originalName.includes('.')) {
                                    originalName = `${originalName}.${ext}`;
                                }
                                
                                const file = new File([blob], originalName, { type: blob.type });
                                dataTransfer.items.add(file);
                                await cache.delete(`/shared-file-${i}`);
                            }
                        }
                        
                        await cache.delete('/shared-file-count');
                        if (namesRes) await cache.delete('/shared-file-names'); 
                        if (dataTransfer.files.length > 0) {
                            fileInput.files = dataTransfer.files;
                            statusMsg.innerText = `${dataTransfer.files.length} shared file(s) ready!`;
                        }
                    }
                }
            }

            renderHistory();
        });
    </script>
</body>
</html>
