<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GH Uploader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f6f8fa" id="theme-meta">
    <style>
        /* --- Theme Variables --- */
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --primary: #2ea44f;
            --text: #24292f;
            --border: #d0d7de;
        }
        [data-theme="dark"] {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text: #e6edf3;
            --border: #30363d;
        }
        [data-theme="black"] {
            --bg-color: #000000;
            --card-bg: #000000;
            --text: #e6edf3;
            --border: #333333;
        }

        /* --- Global Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        
        .header-actions { display: flex; justify-content: center; gap: 10px; margin-top: 15px; align-items: center; }
        .header-btn { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 14px; }

        /* --- Inputs and Selectors --- */
        input[type="text"], input[type="password"], input[type="file"], select, textarea {
            width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border);
            border-radius: 6px; box-sizing: border-box; background-color: var(--card-bg); color: var(--text);
        }
        #theme-selector { width: auto; display: inline-block; padding: 8px; cursor: pointer; margin-bottom: 0; }
        textarea { resize: vertical; font-family: monospace; font-size: 12px; }

        /* --- Tab Navigation --- */
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-nav button {
            border-radius: 6px; padding: 10px; font-size: 16px; border: 2px solid var(--border);
            color: var(--text); background-color: transparent; width: 100%; cursor: pointer;
        }
        .tab-nav button.active-tab { border-color: var(--primary); color: var(--primary); background-color: rgba(46, 164, 79, 0.1); }

        /* --- Buttons --- */
        button.primary-btn {
            background-color: transparent; color: var(--primary); border: 2px solid var(--primary);
            border-radius: 12px; padding: 16px 32px; font-size: 20px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s;
        }
        button.primary-btn:hover { background-color: var(--primary); color: #ffffff; }
        button.primary-btn:disabled { border-color: #94d3a2; color: #94d3a2; cursor: not-allowed; }
        
        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .action-buttons button { flex: 1; padding: 12px 16px; border-radius: 6px; cursor: pointer; }
        .action-buttons input, .action-buttons select { margin-bottom: 0; }
        .delete-btn { border: 2px solid #cf222e; color: #cf222e; padding: 8px 10px; font-size: 14px; margin-top: 5px; background: transparent; cursor: pointer; border-radius: 6px;}
        .delete-btn:hover { background-color: #cf222e; color: #ffffff; }

        /* --- Compression Settings --- */
        .compression-settings { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .compression-queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .compression-queue-item:last-child { border-bottom: none; }
        .btn-preview { padding: 4px 8px; font-size: 11px; background: transparent; border: 1px solid #0969da; color: #0969da; border-radius: 4px; cursor: pointer; }
        .btn-preview:hover { background: #0969da; color: #fff; }
        .savings-badge { background: #2ea44f; color: white; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* --- History Section --- */
        #history-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
        .history-item { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 15px; gap: 15px; align-items: center; }
        .history-left-col { display: flex; flex-direction: column; width: 100px; min-width: 100px; gap: 5px; align-items: center; }
        .history-thumb { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; background-color: var(--bg-color); font-weight: bold; overflow: hidden; }
        .history-filename { font-size: 11px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: lowercase; font-weight: 600; }
        .history-filesize { font-size: 10px; color: #888; text-align: center; }
        .history-details { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .history-details label { font-size: 12px; margin-bottom: 3px; font-weight: 600; }
        .history-details input { font-family: monospace; font-size: 12px; margin-bottom: 8px; cursor: pointer; }

        /* --- Manager Section Styles --- */
        #repo-file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
        .repo-item { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; align-items: center; justify-content: space-between; gap: 10px; }
        .repo-item-info { flex-grow: 1; overflow: hidden; cursor: pointer; }
        .repo-item-name { font-weight: bold; font-size: 14px; word-break: break-all; }
        .repo-item-type { font-size: 11px; color: #888; text-transform: uppercase; }
        .manager-thumb { width: 40px; height: 40px; min-width: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; background-color: var(--bg-color); font-weight: bold; font-size: 10px; overflow: hidden; }
        
        /* Checkboxes */
        .select-cb { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        .select-all-container { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; }

        /* Bulk Action Bar */
        #bulk-action-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--border); padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); z-index: 50; justify-content: center; gap: 15px; box-sizing: border-box;}
        #bulk-action-bar button { padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #bulk-move-btn { background: transparent; border: 2px solid #0969da; color: #0969da; }
        #bulk-delete-btn { background: transparent; border: 2px solid #cf222e; color: #cf222e; }

        /* --- 3-Dot Menu Styles --- */
        .menu-container { position: relative; display: inline-block; }
        .kebab-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 10px; color: var(--text); font-weight: bold; }
        .kebab-btn:hover { color: var(--primary); }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 35px; background-color: var(--card-bg); min-width: 130px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 10; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .dropdown-menu button { width: 100%; text-align: left; border: none; padding: 12px 15px; border-radius: 0; font-size: 14px; background: transparent; color: var(--text); cursor: pointer; }
        .dropdown-menu button:hover { background-color: var(--bg-color); color: var(--primary); }
        .dropdown-menu .delete-action { color: #cf222e; }
        .show { display: block; }

        /* --- Modal Styles --- */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: var(--card-bg); margin: 10% auto; padding: 25px; border: 1px solid var(--border); width: 90%; max-width: 500px; border-radius: 12px; max-height: 80vh; overflow-y: auto;}
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 20px;}
        .close-btn:hover { color: var(--text); }
        #share-preview, #image-preview-container { margin-bottom: 20px; text-align: center; }
        #share-preview img, #image-preview-container img { max-width: 100%; border-radius: 6px; max-height: 400px; object-fit: contain; }
        #status-message, #manager-status { text-align: center; margin-top: 10px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GH Uploader</h1>
            <div class="header-actions">
                <select id="theme-selector">
                    <option value="light">Light Mode</option>
                    <option value="dark">Dark Mode</option>
                    <option value="black">Amoled Black</option>
                </select>
                <button id="import-export-btn" class="header-btn">Data ⚙️</button>
            </div>
        </header>

        <section class="config-section">
            <input type="password" id="gh-token" placeholder="GitHub Personal Access Token" />
            <input type="text" id="gh-repo" placeholder="Owner/Repo (e.g., yourname/gh-uploader)" />
        </section>

        <div class="tab-nav">
            <button id="tab-upload-btn" class="active-tab">Upload</button>
            <button id="tab-manage-btn">Manage Repo</button>
        </div>

        <!-- UPLOAD VIEW -->
        <div id="upload-view">
            <section class="config-section">
                <input type="text" id="gh-folder" placeholder="Upload Folder (leave blank for root)" />
            </section>
            
            <section class="compression-settings">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <input type="checkbox" id="enable-compression" class="select-cb">
                    <label for="enable-compression" style="font-weight: bold;">Enable Image Compression</label>
                </div>
                <div id="compression-options" style="display: none; flex-direction: column; gap: 5px;">
                    <label style="font-size: 12px;">Quality: <span id="quality-val">80</span>%</label>
                    <input type="range" id="compression-quality" min="10" max="100" value="80">
                </div>
                <div id="compression-queue" style="margin-top: 10px;"></div>
            </section>

            <section class="upload-section">
                <input type="file" id="file-input" accept="*/*" multiple />
                <div class="action-buttons">
                    <button id="paste-btn" class="primary-btn" style="padding: 12px; font-size: 16px;">Paste Image</button>
                    <button id="upload-btn" class="primary-btn" style="padding: 12px; font-size: 16px;">Upload File(s)</button>
                </div>
                <div id="status-message"></div>
            </section>
            <section class="history-section">
                <h2>Upload History</h2>
                <div id="history-list"></div>
            </section>
        </div>

        <!-- MANAGE VIEW -->
        <div id="manage-view" style="display: none;">
            <div class="action-buttons">
                <input type="text" id="manager-path" placeholder="Path (e.g., folder/subfolder)" style="flex: 2;" />
                <button id="refresh-dir-btn" class="primary-btn" style="padding: 12px; font-size: 16px; width: auto;">Load</button>
            </div>
            <div class="action-buttons" style="justify-content: space-between; background: var(--card-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
                <div class="select-all-container">
                    <input type="checkbox" id="select-all-cb" class="select-cb">
                    <label for="select-all-cb">Select All</label>
                </div>
                <select id="sort-files" style="width: auto;">
                    <option value="name-asc">A - Z</option>
                    <option value="name-desc">Z - A</option>
                    <option value="size-desc">Largest First</option>
                    <option value="size-asc">Smallest First</option>
                </select>
            </div>
            <div id="manager-status"></div>
            <div id="repo-file-list"></div>
        </div>
    </div>

    <!-- BULK ACTION BAR -->
    <div id="bulk-action-bar">
        <span id="bulk-count" style="align-self: center; font-weight: bold; font-size: 14px;">0 selected</span>
        <button id="bulk-move-btn">Move Selected</button>
        <button id="bulk-delete-btn">Delete Selected</button>
    </div>

    <!-- MODALS -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeShareModal()">&times;</span>
            <h2 style="margin-top: 0;">Share File</h2>
            <div id="share-preview"></div>
            <label style="font-size: 12px; font-weight: bold;">Direct Link:</label>
            <input type="text" id="share-link" readonly onclick="copyToClipboard(this)">
            <label style="font-size: 12px; font-weight: bold;">Markdown:</label>
            <input type="text" id="share-markdown" readonly onclick="copyToClipboard(this)">
        </div>
    </div>

    <div id="preview-modal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <span class="close-btn" onclick="closePreviewModal()">&times;</span>
            <h2 style="margin-top: 0;">Compressed Preview</h2>
            <div id="image-preview-container"></div>
        </div>
    </div>

    <div id="data-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDataModal()">&times;</span>
            <h2 style="margin-top: 0;">Import / Export Data</h2>
            <textarea id="data-textarea" rows="10"></textarea>
            <div class="action-buttons">
                <button class="primary-btn" onclick="importData()" style="padding: 10px; font-size: 14px;">Import & Save</button>
                <button class="primary-btn" onclick="copyDataText()" style="padding: 10px; font-size: 14px; border-color: #0969da; color: #0969da;">Copy JSON</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

            const DOM = {
                token: document.getElementById('gh-token'), repo: document.getElementById('gh-repo'),
                folder: document.getElementById('gh-folder'), fileInput: document.getElementById('file-input'),
                uploadBtn: document.getElementById('upload-btn'), statusMsg: document.getElementById('status-message'),
                historyList: document.getElementById('history-list'), managerPath: document.getElementById('manager-path'),
                repoFileList: document.getElementById('repo-file-list'), managerStatus: document.getElementById('manager-status'),
                selectAllCb: document.getElementById('select-all-cb'), bulkActionBar: document.getElementById('bulk-action-bar'),
                bulkCount: document.getElementById('bulk-count'), bulkMoveBtn: document.getElementById('bulk-move-btn'),
                bulkDeleteBtn: document.getElementById('bulk-delete-btn'), compCb: document.getElementById('enable-compression'),
                compOpts: document.getElementById('compression-options'), compQuality: document.getElementById('compression-quality'),
                qualVal: document.getElementById('quality-val'), compQueue: document.getElementById('compression-queue'),
                importExportBtn: document.getElementById('import-export-btn')
            };

            let currentRepoFiles = [];
            let processedUploadFiles = [];

            // --- Theme & Tabs ---
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.getElementById('theme-meta');
                if (meta) meta.content = theme === 'dark' ? '#0d1117' : theme === 'black' ? '#000000' : '#f6f8fa';
            }
            const savedTheme = localStorage.getItem('ghTheme') || 'light';
            applyTheme(savedTheme);
            document.getElementById('theme-selector').value = savedTheme;
            document.getElementById('theme-selector').addEventListener('change', e => {
                applyTheme(e.target.value); localStorage.setItem('ghTheme', e.target.value);
            });

            document.getElementById('tab-upload-btn').addEventListener('click', function() {
                document.getElementById('upload-view').style.display = 'block'; document.getElementById('manage-view').style.display = 'none';
                this.classList.add('active-tab'); document.getElementById('tab-manage-btn').classList.remove('active-tab');
                DOM.bulkActionBar.style.display = 'none';
            });
            document.getElementById('tab-manage-btn').addEventListener('click', function() {
                document.getElementById('upload-view').style.display = 'none'; document.getElementById('manage-view').style.display = 'block';
                this.classList.add('active-tab'); document.getElementById('tab-upload-btn').classList.remove('active-tab');
                if (DOM.repoFileList.innerHTML === '') loadRepoFiles();
                updateBulkActionVisibility();
            });

            DOM.token.value = localStorage.getItem('ghToken') || '';
            DOM.repo.value = localStorage.getItem('ghRepo') || '';
            if(DOM.folder) DOM.folder.value = localStorage.getItem('ghFolder') || '';

            // --- Data Button Modal ---
            DOM.importExportBtn.addEventListener('click', () => {
                const appData = {
                    ghToken: localStorage.getItem('ghToken') || '',
                    ghRepo: localStorage.getItem('ghRepo') || '',
                    ghFolder: localStorage.getItem('ghFolder') || '',
                    ghTheme: localStorage.getItem('ghTheme') || 'light',
                    ghHistory: JSON.parse(localStorage.getItem('ghHistory')) || []
                };
                document.getElementById('data-textarea').value = JSON.stringify(appData, null, 2);
                document.getElementById('data-modal').style.display = 'block';
            });

            window.closeDataModal = () => document.getElementById('data-modal').style.display = 'none';
            
            window.copyDataText = () => {
                const textarea = document.getElementById('data-textarea');
                textarea.select(); navigator.clipboard.writeText(textarea.value);
                alert('JSON Data copied to clipboard!');
            };

            window.importData = () => {
                try {
                    const appData = JSON.parse(document.getElementById('data-textarea').value);
                    if(appData.ghToken !== undefined) localStorage.setItem('ghToken', appData.ghToken);
                    if(appData.ghRepo !== undefined) localStorage.setItem('ghRepo', appData.ghRepo);
                    if(appData.ghFolder !== undefined) localStorage.setItem('ghFolder', appData.ghFolder);
                    if(appData.ghTheme !== undefined) localStorage.setItem('ghTheme', appData.ghTheme);
                    if(appData.ghHistory !== undefined) localStorage.setItem('ghHistory', JSON.stringify(appData.ghHistory));
                    alert('Data imported successfully! The app will now reload.');
                    location.reload();
                } catch(e) { alert('Invalid JSON format.'); }
            };

            // --- Utilities ---
            const escapeHTML = str => str ? str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag])) : str;

            const formatBytes = (bytes, decimals = 2) => {
                if (!+bytes) return '0 B';
                const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
            };
            const getCdnUrl = rawUrl => rawUrl ? rawUrl.replace(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\//, 'cdn.jsdelivr.net/gh/$1/$2@$3/') : '';

            // --- Check Shared Files from Service Worker ---
            async function checkSharedFiles() {
                if ('caches' in window) {
                    try {
                        const cache = await caches.open('shared-files');
                        const countRes = await cache.match('/shared-file-count');
                        const namesRes = await cache.match('/shared-file-names');
                        
                        if (countRes) {
                            const count = parseInt(await countRes.text());
                            const names = namesRes ? await namesRes.json() : [];
                            const dataTransfer = new DataTransfer();
                            
                            for (let i = 0; i < count; i++) {
                                const res = await cache.match(`/shared-file-${i}`);
                                if (res) {
                                    const blob = await res.blob();
                                    let originalName = names[i];
                                    let ext = blob.type ? blob.type.split('/')[1] : 'bin';
                                    
                                    if (ext.includes(';')) ext = ext.split(';')[0];
                                    
                                    if (!originalName || originalName === 'blob' || originalName === 'image.jpg') {
                                        originalName = `shared_${Date.now()}.${ext}`;
                                    } else if (!originalName.includes('.')) {
                                        originalName = `${originalName}.${ext}`;
                                    }
                                    
                                    const file = new File([blob], originalName, { type: blob.type });
                                    dataTransfer.items.add(file);
                                    await cache.delete(`/shared-file-${i}`);
                                }
                            }
                            
                            await cache.delete('/shared-file-count');
                            if (namesRes) await cache.delete('/shared-file-names'); 
                            
                            if (dataTransfer.files.length > 0) {
                                DOM.fileInput.files = dataTransfer.files;
                                DOM.statusMsg.innerText = `${dataTransfer.files.length} shared file(s) ready!`;
                                processSelectedFiles(); // Trigger preview queue
                            }
                        }
                    } catch (e) {
                        console.error("Error reading shared files from cache:", e);
                    }
                }
            }

            // --- Compression Logic ---
            DOM.compCb.addEventListener('change', e => {
                DOM.compOpts.style.display = e.target.checked ? 'flex' : 'none';
                processSelectedFiles();
            });
            DOM.compQuality.addEventListener('input', e => {
                DOM.qualVal.innerText = e.target.value;
            });
            DOM.compQuality.addEventListener('change', processSelectedFiles);
            DOM.fileInput.addEventListener('change', processSelectedFiles);

            async function compressImage(file, quality) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = event => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width; canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                        }
                    }
                });
            }

            async function processSelectedFiles() {
                DOM.compQueue.innerHTML = '';
                processedUploadFiles = [];
                const files = Array.from(DOM.fileInput.files);
                if (files.length === 0) return;

                const useCompression = DOM.compCb.checked;
                const quality = parseInt(DOM.compQuality.value) / 100;

                for (let file of files) {
                    if (useCompression && file.type.startsWith('image/') && file.type !== 'image/gif') {
                        const compressedBlob = await compressImage(file, quality);
                        compressedBlob.name = file.name.replace(/\.[^/.]+$/, "") + ".jpg"; 
                        processedUploadFiles.push(compressedBlob);

                        const savings = ((1 - (compressedBlob.size / file.size)) * 100).toFixed(1);
                        const objUrl = URL.createObjectURL(compressedBlob);

                        DOM.compQueue.innerHTML += `
                            <div class="compression-queue-item">
                                <span style="width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHTML(file.name)}</span>
                                <span>${formatBytes(file.size)} &rarr; ${formatBytes(compressedBlob.size)}</span>
                                <span class="savings-badge">-${savings}%</span>
                                <button class="btn-preview" onclick="showCompressedPreview('${escapeHTML(objUrl)}')">Preview</button>
                            </div>
                        `;
                    } else {
                        processedUploadFiles.push(file);
                    }
                }
            }

            window.showCompressedPreview = function(url) {
                document.getElementById('image-preview-container').innerHTML = `<img src="${escapeHTML(url)}">`;
                document.getElementById('preview-modal').style.display = 'block';
            }
            window.closePreviewModal = () => document.getElementById('preview-modal').style.display = 'none';

            // --- Upload Logic ---
            DOM.uploadBtn.addEventListener('click', async () => {
                if (processedUploadFiles.length === 0) return alert('Please select a file.');
                const token = DOM.token.value.trim(), repo = DOM.repo.value.trim(), folder = DOM.folder.value.trim();
                if (!token || !repo) return alert('Token and Repo required.');
                
                localStorage.setItem('ghToken', token); localStorage.setItem('ghRepo', repo);
                localStorage.setItem('ghFolder', folder);
                DOM.uploadBtn.disabled = true; let successCount = 0;

                for (let i = 0; i < processedUploadFiles.length; i++) {
                    const file = processedUploadFiles[i];
                    DOM.statusMsg.innerText = `Uploading ${i + 1} of ${processedUploadFiles.length}...`;
                    try {
                        const base64Data = await new Promise((res, rej) => {
                            const reader = new FileReader();
                            reader.onload = () => res(reader.result.split(',')[1]);
                            reader.onerror = e => rej(e);
                            reader.readAsDataURL(file);
                        });
                        
                        const fileName = file.name.replace(/\s+/g, '_');
                        const path = folder ? `${folder}/${fileName}` : fileName;

                        let existingSha = undefined;
                        try {
                            const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { headers: { 'Authorization': `Bearer ${token}` } });
                            if (checkRes.ok) existingSha = (await checkRes.json()).sha;
                        } catch(e) {}

                        const payload = { message: `Upload ${fileName}`, content: base64Data };
                        if (existingSha) payload.sha = existingSha; 

                        const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                            method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        if (response.ok) {
                            successCount++;
                            let history = JSON.parse(localStorage.getItem('ghHistory')) || [];
                            history.unshift({ url: getCdnUrl(data.content.download_url), type: file.type || 'image/jpeg', filename: fileName, size: file.size, date: new Date().toLocaleString() });
                            localStorage.setItem('ghHistory', JSON.stringify(history));
                        }
                    } catch (error) { console.error(`Error:`, error); }
                }

                DOM.statusMsg.innerText = `Uploaded ${successCount} out of ${processedUploadFiles.length} files.`;
                DOM.uploadBtn.disabled = false; DOM.fileInput.value = ''; DOM.compQueue.innerHTML = ''; processedUploadFiles = []; renderHistory();
            });

            function renderHistory() {
                DOM.historyList.innerHTML = '';
                let history = JSON.parse(localStorage.getItem('ghHistory')) || [];
                history.forEach((item, index) => {
                    const isImage = item.type.startsWith('image/');
                    const isVideo = item.type.startsWith('video/') || item.url.match(/\.(mp4|webm|mov|ogg)$/i);
                    const isAudio = item.type.startsWith('audio/') || item.url.match(/\.(mp3|wav|ogg|m4a)$/i);
                    const ext = item.url.split('.').pop().toUpperCase().substring(0,4);

                    const safeUrl = escapeHTML(item.url);
                    const safeName = escapeHTML((item.filename || item.url.split('/').pop()).toLowerCase());
                    const safeMkd = escapeHTML(isImage ? `![Image](${item.url})` : `[File](${item.url})`);

                    let thumb;
                    if (isImage) {
                        thumb = `<img src="${safeUrl}" class="history-thumb" onclick="window.open('${safeUrl}')">`;
                    } else {
                        thumb = `<div class="history-thumb" onclick="window.open('${safeUrl}')">${ext}</div>`;
                    }

                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `
                        <div class="history-left-col">${thumb}<div class="history-filename" title="${safeName}">${safeName}</div><div class="history-filesize">${formatBytes(item.size)}</div></div>
                        <div class="history-details">
                            <label>Direct Link:</label><input type="text" value="${safeUrl}" readonly onclick="copyToClipboard(this)">
                            <label>Markdown:</label><input type="text" value="${safeMkd}" readonly onclick="copyToClipboard(this)">
                            <button class="delete-btn" onclick="deleteHistoryItem(${index})">Remove</button>
                        </div>`;
                    DOM.historyList.appendChild(div);
                });
            }

            // --- Manage Repo & Bulk Actions ---
            document.getElementById('refresh-dir-btn').addEventListener('click', loadRepoFiles);
            document.getElementById('sort-files').addEventListener('change', renderRepoList);

            async function loadRepoFiles() {
                const token = DOM.token.value.trim(), repo = DOM.repo.value.trim(), path = DOM.managerPath.value.trim();
                if (!token || !repo) return alert('Token/Repo required.');
                DOM.managerStatus.innerText = 'Loading...'; DOM.repoFileList.innerHTML = ''; DOM.selectAllCb.checked = false;
                try {
                    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!res.ok) throw new Error('Failed to load directory.');
                    const files = await res.json();
                    DOM.managerStatus.innerText = '';
                    currentRepoFiles = Array.isArray(files) ? files : [files];
                    renderRepoList();
                } catch (e) { DOM.managerStatus.innerText = e.message; }
            }

            function renderRepoList() {
                DOM.repoFileList.innerHTML = '';
                const sortType = document.getElementById('sort-files').value;
                let folders = currentRepoFiles.filter(f => f.type === 'dir').sort((a, b) => a.name.localeCompare(b.name));
                let files = currentRepoFiles.filter(f => f.type === 'file');

                if (sortType === 'name-asc') files.sort((a, b) => a.name.localeCompare(b.name));
                else if (sortType === 'name-desc') files.sort((a, b) => b.name.localeCompare(a.name));
                else if (sortType === 'size-asc') files.sort((a, b) => a.size - b.size);
                else files.sort((a, b) => b.size - a.size);

                [...folders, ...files].forEach(file => {
                    const isFile = file.type === 'file';
                    const isImage = file.name.match(/\.(jpeg|jpg|gif|png|webp|svg)$/i);
                    const isVideo = file.name.match(/\.(mp4|webm|mov|ogg)$/i);
                    const isAudio = file.name.match(/\.(mp3|wav|ogg|m4a)$/i);
                    const fileType = isImage ? 'image' : (isVideo ? 'video' : (isAudio ? 'audio' : 'other'));

                    const cdnUrl = file.download_url ? getCdnUrl(file.download_url) : '';
                    const clickAction = isFile ? `window.open('${cdnUrl}')` : `document.getElementById('manager-path').value = '${file.path}'; document.getElementById('refresh-dir-btn').click();`;
                    
                    const safeUrl = escapeHTML(cdnUrl);
                    const safeName = escapeHTML(file.name);
                    const safePath = escapeHTML(file.path);
                    const safeSha = escapeHTML(file.sha);
                    const safeClickAction = escapeHTML(clickAction);

                    let thumb;
                    if (!isFile) {
                        thumb = `<div class="manager-thumb" onclick="${clickAction}">DIR</div>`;
                    } else if (isImage) {
                        thumb = `<img src="${safeUrl}" class="manager-thumb" onclick="${clickAction}">`;
                    } else {
                        thumb = `<div class="manager-thumb" onclick="${clickAction}">${safeName.split('.').pop().toUpperCase().substring(0,4)}</div>`;
                    }

                    const div = document.createElement('div');
                    div.className = 'repo-item';
                    
                    let actionHtml = isFile 
                        ? `<div class="menu-container"><button class="kebab-btn" onclick="toggleMenu('${safeSha}', event)">&#8942;</button>
                           <div id="menu-${safeSha}" class="dropdown-menu">
                           <button onclick="openShareModal('${safeUrl}', '${fileType}')">Share</button>
                           <button onclick="renameFile('${safePath}', '${safeSha}')">Move/Rename</button>
                           <button class="delete-action" onclick="deleteRemoteFile('${safePath}', '${safeSha}')">Delete</button>
                           </div></div>`
                        : `<button class="btn-move" style="padding:4px 8px; font-size:12px; background:transparent;" onclick="${clickAction}">Open</button>`;

                    div.innerHTML = `
                        <input type="checkbox" class="select-cb repo-file-cb" data-path="${safePath}" data-sha="${safeSha}">
                        ${thumb}
                        <div class="repo-item-info" onclick="${clickAction}">
                            <div class="repo-item-name">${safeName}</div>
                            <div class="repo-item-type">${file.type} ${isFile ? `(${formatBytes(file.size)})` : ''}</div>
                        </div>
                        ${actionHtml}
                    `;
                    DOM.repoFileList.appendChild(div);
                });

                document.querySelectorAll('.repo-file-cb').forEach(cb => {
                    cb.addEventListener('change', updateBulkActionVisibility);
                });
                updateBulkActionVisibility();
            }

            // --- Bulk Logic ---
            DOM.selectAllCb.addEventListener('change', e => {
                document.querySelectorAll('.repo-file-cb').forEach(cb => cb.checked = e.target.checked);
                updateBulkActionVisibility();
            });

            function updateBulkActionVisibility() {
                const selected = document.querySelectorAll('.repo-file-cb:checked').length;
                if (selected > 0 && document.getElementById('manage-view').style.display === 'block') {
                    DOM.bulkActionBar.style.display = 'flex';
                    DOM.bulkCount.innerText = `${selected} selected`;
                } else {
                    DOM.bulkActionBar.style.display = 'none';
                }
            }

            DOM.bulkDeleteBtn.addEventListener('click', async () => {
                const selectedCbs = document.querySelectorAll('.repo-file-cb:checked');
                if (!confirm(`Are you sure you want to delete ${selectedCbs.length} files?`)) return;
                
                const token = DOM.token.value.trim(), repo = DOM.repo.value.trim();
                let success = 0;
                DOM.managerStatus.innerText = `Deleting 0 / ${selectedCbs.length}...`;
                
                for (let cb of selectedCbs) {
                    try {
                        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${cb.dataset.path}`, {
                            method: 'DELETE', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Bulk delete ${cb.dataset.path}`, sha: cb.dataset.sha })
                        });
                        if(res.ok) success++;
                        DOM.managerStatus.innerText = `Deleting ${success} / ${selectedCbs.length}...`;
                    } catch (e) {}
                }
                alert(`Bulk delete complete. ${success} files deleted.`);
                loadRepoFiles();
            });

            DOM.bulkMoveBtn.addEventListener('click', async () => {
                const selectedCbs = document.querySelectorAll('.repo-file-cb:checked');
                const targetFolder = prompt(`Enter target folder path (leave blank for root):`);
                if (targetFolder === null) return; 

                const token = DOM.token.value.trim(), repo = DOM.repo.value.trim();
                let success = 0;
                DOM.managerStatus.innerText = `Moving 0 / ${selectedCbs.length}...`;

                for (let cb of selectedCbs) {
                    const oldPath = cb.dataset.path;
                    const fileName = oldPath.split('/').pop();
                    const newPath = targetFolder ? `${targetFolder}/${fileName}` : fileName;
                    
                    if (oldPath === newPath) continue;

                    try {
                        const getRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${cb.dataset.sha}`, { headers: { 'Authorization': `Bearer ${token}` } });
                        const blobData = await getRes.json();
                        
                        const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${newPath}`, {
                            method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Bulk move to ${newPath}`, content: blobData.content.replace(/\n/g, '') })
                        });

                        if (putRes.ok) {
                            await fetch(`https://api.github.com/repos/${repo}/contents/${oldPath}`, {
                                method: 'DELETE', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: `Cleanup old file`, sha: cb.dataset.sha })
                            });
                            success++;
                        }
                        DOM.managerStatus.innerText = `Moving ${success} / ${selectedCbs.length}...`;
                    } catch (e) {}
                }
                alert(`Bulk move complete. ${success} files moved.`);
                loadRepoFiles();
            });

            // --- Globals ---
            window.copyToClipboard = el => { el.select(); navigator.clipboard.writeText(el.value); el.style.background = '#2ea44f'; el.style.color = '#fff'; setTimeout(() => { el.style.background = ''; el.style.color = ''; }, 300); }
            window.deleteHistoryItem = idx => { let h = JSON.parse(localStorage.getItem('ghHistory')); h.splice(idx, 1); localStorage.setItem('ghHistory', JSON.stringify(h)); renderHistory(); }
            window.toggleMenu = (sha, e) => { e.stopPropagation(); document.querySelectorAll('.dropdown-menu').forEach(m => m.id !== `menu-${sha}` && m.classList.remove('show')); document.getElementById(`menu-${sha}`).classList.toggle('show'); }
            document.addEventListener('click', () => document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show')));
            window.openShareModal = (url, fileType) => {
                document.getElementById('share-modal').style.display = 'block';
                document.getElementById('share-link').value = url;
                document.getElementById('share-markdown').value = fileType === 'image' ? `![Image](${url})` : `[File](${url})`;

                const safeUrl = escapeHTML(url);

                let previewHtml = '';
                if (fileType === 'image') {
                    previewHtml = `<img src="${safeUrl}">`;
                } else if (fileType === 'video') {
                    previewHtml = `<video controls src="${safeUrl}" style="max-width: 100%; max-height: 400px;"></video>`;
                } else if (fileType === 'audio') {
                    previewHtml = `<audio controls src="${safeUrl}" style="width: 100%; margin-top: 20px; margin-bottom: 20px;"></audio>`;
                } else {
                    previewHtml = `<div style="padding:40px; font-weight:bold; font-size:24px; border:2px dashed var(--border);">${safeUrl.split('.').pop().toUpperCase()}</div>`;
                }
                document.getElementById('share-preview').innerHTML = previewHtml;
            }
            window.closeShareModal = () => document.getElementById('share-modal').style.display = 'none';
            
            window.deleteRemoteFile = async (path, sha) => {
                if(!confirm(`Delete ${path}?`)) return;
                const token = DOM.token.value, repo = DOM.repo.value; DOM.managerStatus.innerText = 'Deleting...';
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ message: `Delete ${path}`, sha }) });
                if(res.ok) loadRepoFiles(); else alert('Delete failed.');
            };
            window.renameFile = async (oldPath, sha) => {
                const newPath = prompt('New path:', oldPath); if(!newPath || newPath === oldPath) return;
                const token = DOM.token.value, repo = DOM.repo.value; DOM.managerStatus.innerText = 'Moving...';
                try {
                    const getRes = await fetch(`https://api.github.com/repos/${repo}/git/blobs/${sha}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    const blobData = await getRes.json();
                    const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${newPath}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ message: `Move ${oldPath}`, content: blobData.content.replace(/\n/g, '') }) });
                    if(putRes.ok) { await fetch(`https://api.github.com/repos/${repo}/contents/${oldPath}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ message: 'Cleanup', sha }) }); loadRepoFiles(); }
                } catch(e) { alert('Move failed.'); DOM.managerStatus.innerText = ''; }
            };

            // Call on load
            checkSharedFiles();
            renderHistory();
        });
    </script>
</body>
</html>
